<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  
  <!-- Title of the website -->
  <title>TeutaSteel | Produkte Çeliku të Galvanizuar dhe Përpunim CNC</title>
  
  <!-- Base URL for routing -->
  <base href="/">
  
  <!-- Viewport for responsive design.
       maximum-scale=1 used to sit here, which stops a phone zooming in - on a catalogue where
       people want a closer look at a product photograph, and a WCAG failure besides. -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  
  <!-- Description for SEO -->
  <meta name="description" content="TeutaSteel ofron produkte çeliku të galvanizuar dhe shërbime përpunimi — prerje CNC, lakim tubash dhe zgjidhje të personalizuara. Kërko ofertë.">

  <!-- Robots for indexing and following links -->
  <meta name="robots" content="index, follow, max-image-preview:large">
  
  <!-- The canonical link is set per page by SeoService: a single canonical that
       pointed every page at the home page told search engines that /products and
       the rest were duplicates of /. -->
 
  <!-- Favicon. Both are the company logo: favicon.ico used to be Angular's default
       (a magenta shield), so the browser tab showed the framework's mark rather
       than the business's, and the site being replaced did show its own. -->
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Web app manifest: keeps the site installable on a phone, as the previous
       site's manifest.json did. The icons are rendered from assets/logo.svg. -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111827">

  <!-- Icons come from the bundled bootstrap-icons package, and the font from
       assets/fonts (self-hosted). The flag-icon-css stylesheet that used to be
       loaded from cdnjs here was never referenced by any template. -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

  <!-- Open Graph for social media sharing -->
  <meta property="og:site_name" content="TeutaSteel">
  <meta property="og:locale" content="sq_AL">
  <meta property="og:title" content="TeutaSteel | Produkte Çeliku të Galvanizuar dhe Përpunim CNC">
  <meta property="og:description" content="Produkte çeliku të galvanizuar, prerje CNC, lakim tubash dhe zgjidhje të personalizuara. Kërko ofertë.">
  <meta property="og:image" content="https://www.teutasteel.com/assets/images/cnc.jpg">
  <meta property="og:image:alt" content="Prerje CNC e çelikut në punëtorinë e TeutaSteel">
  <meta property="og:url" content="https://www.teutasteel.com/">
  <meta property="og:type" content="website">

  <!-- Twitter Card for social media sharing -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="TeutaSteel | Produkte Çeliku të Galvanizuar dhe Përpunim CNC">
  <meta name="twitter:description" content="Produkte çeliku, prerje CNC dhe lakim tubash në Kosovë. Kërko ofertë.">
  <meta name="twitter:image" content="https://www.teutasteel.com/assets/images/cnc.jpg">
  <meta name="twitter:image:alt" content="Prerje CNC e çelikut në punëtorinë e TeutaSteel">

  <!-- Structured Data (JSON-LD) for SEO -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": ["Organization", "LocalBusiness"],
    "name": "TeutaSteel",
    "url": "https://www.teutasteel.com/",
    "logo": "https://www.teutasteel.com/assets/logo.svg",
    "image": "https://www.teutasteel.com/assets/images/cnc.jpg",
    "description": "TeutaSteel furnizon produkte çeliku të galvanizuar dhe shërbime prerjeje e përpunimi në Kosovë.",
    "telephone": "+38344133208",
    "priceRange": "€€",
    "currenciesAccepted": "EUR",
    "areaServed": {
      "@type": "Country",
      "name": "Kosovo"
    },
    "contactPoint": {
      "@type": "ContactPoint",
      "telephone": "+38344133208",
      "email": "info@teutasteel.com",
      "contactType": "Customer Service"
    },
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Rruga Idriz Seferi 26",
      "addressLocality": "Gjilan",
      "postalCode": "60010",
      "addressCountry": "XK"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": 42.454842,
      "longitude": 21.463374
    }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "TeutaSteel",
    "url": "https://www.teutasteel.com/",
    "inLanguage": ["sq", "en"],
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://www.teutasteel.com/products/?q={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>
  
</head>
<body>
  <app-root></app-root>
</body>
</html>
