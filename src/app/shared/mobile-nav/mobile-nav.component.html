<!-- Sticky mobile header -->
<header class="mnav-header" role="banner">
  <!-- Left: Language Switcher -->
  <div class="language-switcher d-flex align-items-center">
    <button class="lang-btn" [ngClass]="{'active': this.shared.lang === 'al'}" (click)="switchLanguage('al')">AL</button>
    <button class="lang-btn" [ngClass]="{'active': this.shared.lang==='en'}" (click)="switchLanguage('en')">EN</button>
  </div>

  <!-- Brand (centered logo/name) -->
  <a class="brand" routerLink="/" [attr.aria-label]="'NAVBAR.HOME' | translate">
    <!-- <img class="brand-logo" src="assets/logo.svg" alt="YourBrand logo" /> -->
    <span class="brand-name">Teuta Steel</span>
  </a>

  <!-- Hamburger -->
  <button
    #toggleButton
    class="mnav-toggle"
    type="button"
    (click)="toggle()"
    [attr.aria-expanded]="open"
    aria-controls="mnav-sheet"
    [attr.aria-label]="'MOBILE_MENU.OPEN' | translate"
  >
    <span class="sr-only">Menu</span>
    <span class="mnav-bar"></span>
    <span class="mnav-bar"></span>
    <span class="mnav-bar"></span>
  </button>
</header>

<!-- Off-canvas drawer. While it is closed it is inert, so nothing inside it can be
     reached with the keyboard or announced by a screen reader. -->
<nav id="mnav-sheet" class="mnav-sheet" [class.open]="open" [attr.inert]="open ? null : ''" [attr.aria-label]="'MOBILE_MENU.NAVIGATION' | translate">
  <div class="mnav-panel" role="dialog" aria-modal="true" aria-labelledby="mnav-title">
    <div class="mnav-top">
      <a class="brand small" routerLink="/" (click)="close()">
        <img class="brand-logo" src="assets/logo.svg" alt="" />
        <span id="mnav-title" class="brand-name">Teuta Steel</span>
      </a>
      <button #closeButton class="mnav-close" type="button" (click)="close()" [attr.aria-label]="'MOBILE_MENU.CLOSE' | translate">✕</button>
    </div>

    <ul class="mnav-links" role="menu">
      <li role="none">
        <a role="menuitem" routerLink="/" [routerLinkActive]="'active'" [routerLinkActiveOptions]="{exact:true}" (click)="close()">
          {{ 'NAVBAR.HOME' | translate }}
        </a>
      </li>
      <li role="none">
        <a role="menuitem" routerLink="/products" routerLinkActive="active" (click)="close()">
          {{ 'NAVBAR.PRODUCTS' | translate }}
        </a>
      </li>
      <li role="none">
        <a role="menuitem" routerLink="/services" routerLinkActive="active" (click)="close()">
          {{ 'NAVBAR.SERVICES' | translate }}
        </a>
      </li>
      <li role="none">
        <a role="menuitem" routerLink="/about" routerLinkActive="active" (click)="close()">
          {{ 'NAVBAR.ABOUT_US' | translate }}
        </a>
      </li>
      <li role="none">
        <a role="menuitem" routerLink="/contact" routerLinkActive="active" (click)="close()">
          {{ 'NAVBAR.CONTACT' | translate }}
        </a>
      </li>
      <li role="none" class="mnav-cta">
        <a role="menuitem" routerLink="/login" (click)="close()" [hidden]="isLoggedIn">
          <i class="bi bi-person-circle fs-5" aria-hidden="true"></i> {{ 'NAVBAR.LOGIN' | translate }}
        </a>
        <button type="button" role="menuitem" class="mnav-logout" [hidden]="!isLoggedIn" (click)="logout()">
          <i class="bi bi-box-arrow-right fs-5" aria-hidden="true"></i> {{ 'MISC.LOGOUT' | translate }}
        </button>
      </li>
    </ul>

    <div class="mnav-footer">
      <a [href]="'mailto:' + email" class="link">{{ email }}</a>
      <a [href]="'tel:' + phone" class="link">{{ phoneDisplay }}</a>
    </div>
  </div>

  <!-- <button class="mnav-scrim" (click)="close()" aria-label="Close menu overlay"></button> -->
</nav>
