<div class="dashboard py-5 px-3 mb-5 mt-5">
  <div class="container">
    <h1 class="h2">{{ 'USER_DASHBOARD.USER_DASHBOARD' | translate }}</h1>

    <p *ngIf="loading">{{ 'MISC.LOADING' | translate }}…</p>

    <div *ngIf="user">
      <p><strong>{{ 'MISC.NAME' | translate }}</strong> {{ user.username }}</p>
      <p><strong>{{ 'MISC.EMAIL' | translate }}</strong> {{ user.email }}</p>
    </div>

    <p *ngIf="failed" class="text-muted">{{ 'USER_DASHBOARD.UNAVAILABLE' | translate }}</p>
  </div>
</div>
