<section class="login-page">
  <div class="login-shell">
    <div class="login-card">
      <aside class="login-brand">
        <a class="login-logo" href="/">
          <img src="assets/logo.svg" alt="" width="34" height="34" aria-hidden="true">
          <span>Teuta Steel</span>
        </a>
        <div class="login-brand-copy">
          <span class="login-kicker">{{ 'LOGIN.STAFF_ONLY' | translate }}</span>
          <p>{{ 'LOGIN.STAFF_HINT' | translate }}</p>
        </div>
        <a class="login-back" href="/">{{ 'LOGIN.BACK_HOME' | translate }} <span aria-hidden="true">&rarr;</span></a>
      </aside>

      <div class="login-form-panel">
        <ng-container *ngIf="!isLoggedIn">
          <h1 class="h2">{{ 'LOGIN.LOGIN' | translate }}</h1>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
            <div class="form-group">
              <label for="username">{{ 'USER_DASHBOARD.USER_NAME' | translate }}</label>
              <input id="username" type="text" formControlName="username"
                     placeholder="{{ 'MISC.ENTER_YOUR_USERNAME' | translate }}"
                     autocomplete="username" required />
            </div>

            <div class="form-group">
              <label for="password">{{ 'MISC.PASSWORD' | translate }}</label>
              <input id="password" type="password" formControlName="password"
                     placeholder="{{ 'MISC.ENTER_YOUR_PASSWORD' | translate }}"
                     autocomplete="current-password" required />
            </div>

            <p *ngIf="errorMessage" class="error-message" role="alert">{{ errorMessage | translate }}</p>

            <button type="submit" class="btn btn-accent login-submit">{{ 'LOGIN.LOGIN' | translate }}</button>
          </form>
        </ng-container>

        <ng-container *ngIf="isLoggedIn">
          <h1 class="h2">{{ 'MISC.WELCOME_USERNAME_' | translate: { username: username } }}</h1>
          <div class="login-signed-in">
            <button class="btn btn-accent" (click)="goToDashboard()">
              {{ (role === 'admin' ? 'MISC.GO_TO_ADMIN_DASHBOARD' : 'MISC.GO_TO_USER_DASHBOARD') | translate }}
            </button>
            <button class="btn btn-outline-secondary" (click)="onLogout()">{{ 'MISC.LOGOUT' | translate }}</button>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</section>
